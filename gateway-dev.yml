server:
  port: 8081

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: modulo-alumnos
              uri: lb://modulo-alumnos
              predicates:
                - Path=/alumnos/**

            - id: modulo-cursos
              uri: lb://modulo-cursos
              predicates:
                - Path=/cursos/**

            - id: modulo-administracion
              uri: lb://modulo-administracion
              predicates:
                - Path=/personal/**

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    lease-renewal-interval-in-seconds: 10
